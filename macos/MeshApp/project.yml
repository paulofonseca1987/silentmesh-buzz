# XcodeGen spec — the project file is generated, never hand-edited.
#
# project.pbxproj is a machine-written format where a bad edit corrupts
# silently; keeping the spec in YAML means the project is reviewable in a
# diff and reproducible with `xcodegen generate`.
name: MeshApp
options:
  bundleIdPrefix: net.silentmesh
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  MeshProtocol:
    path: ../MeshProtocol

targets:
  MeshApp:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - package: MeshProtocol
        product: MeshProtocol
      - package: MeshProtocol
        product: MeshVault
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: Silent Mesh
        CFBundleDisplayName: Silent Mesh
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        # No sandbox yet: the vault slice adds the entitlements this app
        # will need, and turning the sandbox on before then would only
        # produce failures unrelated to what is being built.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.silentmesh.MeshApp
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        # Signing is not cosmetic here: the Secure Enclave refuses to
        # persist a key for an app with no team identifier (-34018), so an
        # unsigned build silently loses the vault. Pinned in the spec
        # because `xcodegen generate` rewrites the project and would drop
        # a team set through Xcode's UI.
        DEVELOPMENT_TEAM: 2AK3972Z54
        CODE_SIGN_ENTITLEMENTS: Sources/MeshApp.entitlements
        ENABLE_HARDENED_RUNTIME: YES
